{% extends 'inventory/base.html' %}
{% block title %}Mon Profil{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm rounded-4 mx-auto" style="max-width: 680px;">
    <div class="card-body p-4 p-lg-5">
        <div class="text-center mb-4">
            <div class="bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 80px; height: 80px;">
                <i class="bi bi-person-circle fs-1 text-primary"></i>
            </div>
            <h2 class="fw-bold">Mon Profil</h2>
            <p class="text-muted">Gérez vos informations personnelles</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-3" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i> {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Nom d'utilisateur</label>
                <input type="text" name="username" class="form-control rounded-3" value="{{ user.username }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" name="email" class="form-control rounded-3" value="{{ user.email }}" required>
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Prénom</label>
                    <input type="text" name="first_name" class="form-control rounded-3" value="{{ user.first_name }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nom</label>
                    <input type="text" name="last_name" class="form-control rounded-3" value="{{ user.last_name }}">
                </div>
            </div>
            <hr class="my-4">
            <div class="mb-3">
                <label class="form-label fw-semibold">Nouveau mot de passe</label>
                <input type="password" name="new_password" class="form-control rounded-3" placeholder="Laissez vide pour ne pas changer">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Confirmer le mot de passe</label>
                <input type="password" name="confirm_password" class="form-control rounded-3" placeholder="Laissez vide pour ne pas changer">
            </div>
            <div class="d-flex gap-3">
                <button type="submit" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-save me-2"></i>Enregistrer
                </button>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="bi bi-arrow-left me-2"></i>Retour
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
