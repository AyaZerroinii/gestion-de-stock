{% extends 'inventory/base.html' %}
{% block content %}
<div class="card border-0 shadow-sm rounded-4 mx-auto" style="max-width: 450px;">
    <div class="card-body p-4">
        <h2 class="fw-bold text-gradient mb-3">Mot de passe oublié ?</h2>
        <p class="text-muted">Entrez votre email pour recevoir un lien de réinitialisation.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary rounded-pill w-100 py-2">Envoyer</button>
        </form>
        <hr>
        <a href="{% url 'login' %}" class="text-decoration-none">Retour à la connexion</a>
    </div>
</div>
{% endblock %}
