{% extends 'inventory/base.html' %}
{% block content %}
<h2>{% if entreprise %}Modifier Entreprise{% else %}Ajouter Entreprise{% endif %}</h2>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Nom</label>
        <input type="text" name="nom" class="form-control" value="{{ entreprise.nom|default:'' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Adresse</label>
        <input type="text" name="adresse" class="form-control" value="{{ entreprise.adresse|default:'' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Téléphone</label>
        <input type="text" name="tel" class="form-control" value="{{ entreprise.tel|default:'' }}">
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a class="btn btn-secondary" href="{% url 'entreprise_list' %}">Annuler</a>
</form>
{% endblock %}
