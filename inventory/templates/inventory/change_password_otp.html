{% extends 'inventory/base.html' %}
{% block title %}Changer le mot de passe{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-header bg-primary text-white text-center py-3 rounded-top-4">
                <i class="bi bi-shield-lock fs-1"></i>
                <h4 class="mb-0 mt-2">Changer votre mot de passe</h4>
            </div>
            <div class="card-body p-4">
                <div class="alert alert-info">
                    <i class="bi bi-envelope me-2"></i>
                    Un code OTP a été envoyé à votre adresse email.
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Code OTP</label>
                        <input type="text" name="otp_code" class="form-control form-control-lg text-center fs-3" placeholder="000000" maxlength="6" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nouveau mot de passe</label>
                        <input type="password" name="new_password" id="new_password" class="form-control rounded-3" required>
                        <div class="form-text small">Minimum 8 caractères, une majuscule, un chiffre</div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirmer le mot de passe</label>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control rounded-3" required>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary rounded-pill py-2">
                            <i class="bi bi-check-circle me-2"></i>Changer le mot de passe
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const newPw = document.getElementById('new_password');
    const confirmPw = document.getElementById('confirm_password');
    const form = document.querySelector('form');
    
    function showMessage(message, isError = true) {
        const oldMsg = document.querySelector('.pw-msg');
        if (oldMsg) oldMsg.remove();
        
        const div = document.createElement('div');
        div.className = `alert alert-${isError ? 'danger' : 'success'} alert-dismissible fade show rounded-3 pw-msg`;
        div.innerHTML = `<i class="bi bi-${isError ? 'exclamation-triangle-fill' : 'check-circle-fill'} me-2"></i> ${message}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
        form.insertBefore(div, form.firstChild);
        setTimeout(() => div.remove(), 4000);
    }
    
    form.addEventListener('submit', function(e) {
        if (newPw.value !== confirmPw.value) {
            e.preventDefault();
            showMessage('Les mots de passe ne correspondent pas');
        } else if (newPw.value.length < 8) {
            e.preventDefault();
            showMessage('Le mot de passe doit contenir au moins 8 caractères');
        }
    });
</script>
{% endblock %}
