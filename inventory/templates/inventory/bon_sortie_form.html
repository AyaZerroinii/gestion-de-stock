{% extends 'inventory/base.html' %}
{% block content %}
<h2>Créer Bon de Sortie</h2>
{% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
<form method="post">
    {% csrf_token %}
    <div class="form-field">
        <label>Client</label>
        <select name="client">
            {% for c in clients %}
                <option value="{{ c.pk }}">{{ c.designation }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-field">
        <label>Produit</label>
        <select name="produit">
            {% for p in produits %}
                <option value="{{ p.pk }}">{{ p.designation }} (stock {{ p.qte_stock }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-field">
        <label>Quantité Sortie</label>
        <input name="qte" type="number" min="1" value="1" />
    </div>
    <button class="button" type="submit">Sauvegarder</button>
    <a class="button" href="{% url 'bon_sortie_list' %}">Annuler</a>
</form>
{% endblock %}
