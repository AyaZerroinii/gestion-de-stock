{% extends 'inventory/base.html' %}
{% block content %}
<h2>Entreprises</h2>
<p><a class="btn btn-primary" href="{% url 'entreprise_create' %}">Ajouter une entreprise</a></p>
<table class="table table-striped">
    <thead>
        <tr><th>ID</th><th>Nom</th><th>Adresse</th><th>Téléphone</th><th>Actions</th></tr>
    </thead>
    <tbody>
        {% for e in entreprises %}
            <tr>
                <td>{{ e.id_ent }}</td>
                <td>{{ e.nom }}</td>
                <td>{{ e.adresse }}</td>
                <td>{{ e.tel }}</td>
                <td>
                    <a class="btn btn-sm btn-warning" href="{% url 'entreprise_edit' e.pk %}">Modifier</a>
                    <a class="btn btn-sm btn-danger" href="{% url 'entreprise_delete' e.pk %}">Supprimer</a>
                </td>
            </tr>
        {% empty %}
            <tr><td colspan="5">Aucune entreprise.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
