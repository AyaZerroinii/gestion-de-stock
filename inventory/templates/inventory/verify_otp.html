{% extends 'inventory/base.html' %}
{% block title %}Vérification OTP{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-body p-4 text-center">
                <i class="bi bi-shield-lock fs-1 text-primary mb-3 d-block"></i>
                <h4 class="fw-bold">Vérification à deux facteurs</h4>
                <p class="text-muted">Un code OTP a été envoyé à votre adresse email.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="text" name="otp_code" class="form-control form-control-lg text-center fs-3 rounded-3" placeholder="000000" maxlength="6" autofocus required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2">
                        <i class="bi bi-check-circle me-2"></i>Vérifier
                    </button>
                </form>
                
                <hr class="my-4">
                
                <div class="small text-muted">
                    <i class="bi bi-info-circle"></i> Le code expire dans 5 minutes.
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
