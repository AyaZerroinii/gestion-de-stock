{% extends 'inventory/base.html' %}
{% block content %}
<h2>Supprimer Fournisseur</h2>
<p>Voulez-vous supprimer {{ fournisseur.designation }} ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Supprimer</button>
    <a class="btn btn-secondary" href="{% url 'fournisseur_list' %}">Annuler</a>
</form>
{% endblock %}
