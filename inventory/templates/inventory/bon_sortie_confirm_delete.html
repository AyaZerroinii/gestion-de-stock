{% extends 'inventory/base.html' %}
{% block content %}
<h2>Supprimer Bon de Sortie</h2>
<p>Voulez-vous vraiment supprimer le bon de sortie #{{ bon.pk }} ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger rounded-pill px-4">Supprimer</button>
    <a class="btn btn-outline-secondary rounded-pill px-4" href="{% url 'bon_sortie_list' %}">Annuler</a>
</form>
{% endblock %}
