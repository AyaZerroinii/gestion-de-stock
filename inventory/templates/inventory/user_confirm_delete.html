{% extends 'inventory/base.html' %}
{% block content %}
<h2>Supprimer utilisateur</h2>
<p>Voulez-vous vraiment supprimer l'utilisateur <strong>{{ user_obj.username }}</strong> ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger rounded-pill px-4">Supprimer</button>
    <a class="btn btn-outline-secondary rounded-pill px-4" href="{% url 'user_list' %}">Annuler</a>
</form>
{% endblock %}
