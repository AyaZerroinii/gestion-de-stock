<!-- includes/_top_table.html -->
<div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
            <tr>
                <th>Nom</th>
                <th class="text-end">Total</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>
                    <strong>{{ item.name|default:item.designation|default:item.num }}</strong>
                </td>
                <td class="text-end">
                    <span class="badge bg-primary rounded-pill">{{ item.total_qte|default:item.total_out|default:item.total_in }} unités</span>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2" class="text-center text-muted py-3">
                    <i class="bi bi-inbox"></i> Aucune donnée disponible
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
