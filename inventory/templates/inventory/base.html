<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion de Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #343a40; }
        .card { margin-bottom: 20px; }
        .low-stock { background-color: #f8d7da; }
        @media print {
            .no-print { display: none; }
            body { background: white; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'home' %}">Gestion de Stock</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'data_dashboard' %}">Data Grid</a>
                    {% if user.is_superuser %}
                        <a class="nav-link" href="{% url 'client_list' %}">Clients</a>
                        <a class="nav-link" href="{% url 'fournisseur_list' %}">Fournisseurs</a>
                        <a class="nav-link" href="{% url 'entreprise_list' %}">Entreprises</a>
                        <a class="nav-link" href="{% url 'user_management' %}">Utilisateurs</a>
                    {% endif %}
                    <span class="navbar-text me-3">Connecté: {{ user.username }}</span>
                    <a class="nav-link" href="{% url 'logout' %}">Déconnexion</a>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Connexion</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
