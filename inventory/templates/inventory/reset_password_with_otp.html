{% extends 'inventory/base.html' %}
{% block title %}Demande OTP{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-header" style="background: linear-gradient(145deg, #0f2b4d 0%, #0a1f3a 100%); color: white; text-align: center; padding: 1.5rem;">
                <i class="bi bi-shield-lock fs-1"></i>
                <h3 class="mb-0 mt-2">Changement de mot de passe</h3>
                <p class="small text-white-50 mb-0">Vérification en deux étapes</p>
            </div>
            <div class="card-body p-4 text-center">
                <p class="text-muted">
                    Un code OTP va être envoyé à votre adresse email pour vérifier votre identité.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn rounded-pill py-2" style="background: linear-gradient(145deg, #0f2b4d 0%, #0a1f3a 100%); color: white; border: none;">
                            <i class="bi bi-envelope me-2"></i>Recevoir le code OTP
                        </button>
                        <a href="{% url 'change_password_request' %}" class="btn btn-outline-secondary rounded-pill">
                            <i class="bi bi-arrow-left me-2"></i>Retour
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
