{% extends 'inventory/base.html' %}
{% block content %}
<h2>Clients</h2>
<p><a class="btn btn-primary rounded-pill px-4" href="{% url 'client_create' %}">Ajouter un client</a></p>
<table class="table table-striped">
    <thead>
        <tr><th>Code</th><th>Nom</th><th>Téléphone</th><th>Actions</th></tr>
    </thead>
    <tbody>
        {% for client in clients %}
            <tr>
                <td>{{ client.code_cl }}</td>
                <td>{{ client.designation }}</td>
                <td>{{ client.tel }}</td>
                <td>
                    <a class="btn btn-sm btn-outline-secondary rounded-pill px-3" href="{% url 'client_edit' client.pk %}">Modifier</a>
                    <a class="btn btn-sm btn-danger rounded-pill px-3" href="{% url 'client_delete' client.pk %}">Supprimer</a>
                </td>
            </tr>
        {% empty %}
            <tr><td colspan="4">Aucun client trouvé.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
