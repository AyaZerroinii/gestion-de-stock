{% extends 'inventory/base.html' %}
{% block title %}Vérification OTP{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-header bg-warning text-dark text-center py-3 rounded-top-4">
                <i class="bi bi-shield-lock fs-1"></i>
                <h3 class="mb-0 mt-2">Vérification</h3>
            </div>
            <div class="card-body p-4 text-center">
                <div class="alert alert-info">
                    <i class="bi bi-envelope me-2"></i>
                    Un code OTP a été envoyé à votre adresse email.
                </div>
                
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-3">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="text" name="otp_code" class="form-control form-control-lg text-center fs-3" placeholder="000000" maxlength="6" required autofocus>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary rounded-pill py-2">
                            <i class="bi bi-check-circle me-2"></i>Vérifier
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
