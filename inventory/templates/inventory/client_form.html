{% extends 'inventory/base.html' %}
{% block content %}
<div class="card form-card border-0 shadow-sm mx-auto" style="max-width: 760px;">
    <div class="card-body">
        <div class="mb-4">
            <h2 class="mb-1">{% if client %}Modifier Client{% else %}Ajouter Client{% endif %}</h2>
            <p class="text-muted mb-0">Formulaire client stylisé pour correspondre à l'interface du tableau de bord.</p>
        </div>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Nom</label>
                <input type="text" name="designation" class="form-control" value="{{ client.designation|default:'' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Téléphone</label>
                <input type="text" name="tel" class="form-control" value="{{ client.tel|default:'' }}">
            </div>
            <div class="d-flex flex-wrap gap-3 mt-4">
                <button type="submit" class="btn btn-primary rounded-pill px-4">Enregistrer</button>
                <a class="btn btn-outline-secondary rounded-pill px-4" href="{% url 'client_list' %}">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
