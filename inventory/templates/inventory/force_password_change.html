{% extends 'inventory/base.html' %}
{% block content %}
<div class="card border-0 shadow-sm rounded-4 mx-auto" style="max-width: 500px;">
    <div class="card-body p-4 text-center">
        <i class="bi bi-shield-lock fs-1 text-warning mb-3 d-block"></i>
        <h2 class="fw-bold mb-3">Changement obligatoire</h2>
        <p class="text-muted">Vous devez changer votre mot de passe pour continuer.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary rounded-pill px-4">Changer</button>
        </form>
    </div>
</div>
{% endblock %}
