<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion de Stock - Frontend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
            background-color: #b0c8f0;
            margin: 0;
            min-height: 100vh;
        }
        .status {
            margin-top: 0.75rem;
            color: #334155;
        }
        .card-custom {
            border-radius: 1.5rem;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.06);
        }
        .table thead th {
            background-color: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
            color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="card card-custom p-4">
            <div class="mb-4">
                <h1 class="display-5 fw-bold">Gestion de stock</h1>
                <p class="text-muted mb-0">Vue dynamique des produits via l'API Django.</p>
            </div>
            <button id="refresh" class="btn btn-primary rounded-pill px-4">Actualiser</button>
            <div id="status" class="status"></div>

            <div class="table-responsive mt-4">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                        <tr>
                            <th>code_p</th>
                            <th>designation</th>
                            <th>qte_stock</th>
                            <th>stock_alerte</th>
                        </tr>
                    </thead>
                    <tbody id="produit-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchProducts() {
            const status = document.getElementById('status');
            status.textContent = 'Chargement...';
            try {
                const res = await fetch('/api/produits/');
                if (!res.ok) throw new Error('Erreur HTTP ' + res.status);
                const data = await res.json();
                const tbody = document.getElementById('produit-list');
                tbody.innerHTML = '';
                data.produits.forEach(p => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${p.code_p}</td>
                        <td>${p.designation}</td>
                        <td>${p.qte_stock}</td>
                        <td>${p.stock_alerte}</td>
                    `;
                    tbody.appendChild(row);
                });
                status.textContent = `Produits affichés: ${data.produits.length}`;
            } catch (err) {
                status.textContent = 'Erreur: ' + err.message;
            }
        }

        document.getElementById('refresh').addEventListener('click', fetchProducts);
        fetchProducts();
    </script>
</body>
</html>
