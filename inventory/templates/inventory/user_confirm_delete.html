{% extends 'inventory/base.html' %}
{% block content %}
<h2>Supprimer utilisateur</h2>
<p>Voulez-vous vraiment supprimer l'utilisateur <strong>{{ user_obj.username }}</strong> ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="button danger">Supprimer</button>
    <a class="button" href="{% url 'user_management' %}">Annuler</a>
</form>
{% endblock %}
