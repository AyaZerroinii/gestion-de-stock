{% extends 'inventory/base.html' %}
{% block content %}
<div class="card border-0 shadow-sm rounded-4 mx-auto" style="max-width: 600px;">
    <div class="card-body p-4">
        <h2 class="fw-bold text-gradient mb-4">Créer un utilisateur</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary rounded-pill px-4">Créer</button>
            <a href="{% url 'user_list' %}" class="btn btn-outline-secondary rounded-pill px-4">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
